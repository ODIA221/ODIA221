name: Mise à jour des Statistiques GitHub

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global pull.rebase false

      - name: Générer les statistiques
        uses: anuraghazra/github-readme-stats@main
        id: stats
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_icons: true
          locale: fr
          theme: dark
          count_private: true
          include_all_commits: true
          cache_seconds: 43200

      - name: Mettre à jour le README
        run: |
          # Ici vous devriez ajouter un script qui:
          # 1. Récupère les URLs générées par l'action précédente (${{ steps.stats.outputs...}})
          # 2. Insère ces images dans votre README.md
          # 3. Vérifie les modifications
          
          if git diff --quiet README.md; then
            echo "Aucune modification nécessaire"
          else
            git add README.md
            git commit -m "📊 Mise à jour des stats GitHub [skip ci]"
            git push
          fi
