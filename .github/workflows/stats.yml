name: Update GitHub Stats
on:
  schedule:
    - cron: '0 0 * * *'  # Exécution quotidienne à minuit
  workflow_dispatch:     # Permet un déclenchement manuel
  push:
    branches: [ main ]   # Se déclenche aussi quand vous poussez des changements

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate GitHub Stats
        uses: anuraghazra/github-readme-stats@main
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          show_icons: true
          locale: fr       # Pour avoir les textes en français
          theme: dark      # Thème sombre
          cache_seconds: 86400  # Cache de 24h

      - name: Commit and push if stats changed
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          if git commit -m "Update GitHub stats [skip ci]"; then
            git push
          fi
