name: Mise à jour des Statistiques GitHub

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: pip install requests pyyaml

      - name: Télécharger les stats et mettre à jour le README
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Script Python pour générer et insérer les stats
          python3 << 'EOF'
          # Votre script Python ici (voir explication ci-dessous)
          EOF

          # Configuration Git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Commit et push si modifications
          if git diff --quiet; then
            echo "Aucune modification détectée"
          else
            git add README.md
            git commit -m "📊 Mise à jour des stats GitHub [skip ci]"
            git push
          fi
