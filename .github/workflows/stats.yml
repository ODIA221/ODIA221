name: Mise à jour des Statistiques GitHub

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Générer les statistiques
        uses: anuraghazra/github-readme-stats@main
        id: generate_stats
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_icons: true
          locale: fr
          theme: dark
          count_private: true
          include_all_commits: true
          cache_seconds: 43200

      - name: Mettre à jour le README
        run: |
          # Récupérer les URLs des images générées
          # Note: L'action github-readme-stats ne retourne pas d'outputs par défaut
          # Nous devons donc les construire manuellement
          USERNAME="ODIA221"
          STATS_URL="https://github-readme-stats.vercel.app/api?username=$USERNAME&show_icons=true&locale=fr&theme=dark&count_private=true&include_all_commits=true"
          
          # Insérer les stats dans le README.md
          sed -i "s|<!-- STATS_START -->.*<!-- STATS_END -->|<!-- STATS_START -->\n![Statistiques GitHub]($STATS_URL)\n<!-- STATS_END -->|g" README.md
          
          # Vérifier et pousser les modifications
          if git diff --quiet README.md; then
            echo "Aucune modification nécessaire"
          else
            git add README.md
            git commit -m "📊 Mise à jour des stats GitHub [skip ci]"
            git push
          fi
