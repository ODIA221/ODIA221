name: Mise à jour des Statistiques GitHub

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Mettre à jour les stats dans README
        run: |
          # Générer les URLs des images
          STATS_URL="https://github-readme-stats.vercel.app/api?username=ODIA221&show_icons=true&locale=fr&theme=dark&count_private=true&include_all_commits=true"
          LANG_URL="https://github-readme-stats.vercel.app/api/top-langs/?username=ODIA221&layout=compact&theme=dark&count_private=true"

          # Mettre à jour le README.md
          sed -i '/<!-- STATS_START -->/,/<!-- STATS_END -->/{
              /<!-- STATS_START -->/{
                  a\
![Statistiques GitHub]('"$STATS_URL"')\n![Top Langages]('"$LANG_URL"')
              }
              /<!-- STATS_END -->/!d
          }' README.md

          # Vérifier et pousser les modifications
          if git diff --quiet README.md; then
            echo "Aucune modification nécessaire"
          else
            git add README.md
            git commit -m "📊 Mise à jour des stats GitHub [skip ci]"
            git push
          fi
